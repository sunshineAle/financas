<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#141413" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dagda Capital" />
    <title>Dagda Capital — Prévia 79–97</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Guarda o convite de instalação (disparado cedo) para o botão "Instalar o app" da tela de boas-vindas.
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__sfInstalar = e; window.dispatchEvent(new Event('sf:instalar-pronto')); });
      window.addEventListener('appinstalled', function () { window.__sfInstalar = null; window.dispatchEvent(new Event('sf:instalar-pronto')); });
    </script>
    <script>
      try {
        var m = localStorage.getItem('sf:tema') || 'auto';
        var claro = m === 'claro' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', claro ? 'light' : 'dark');
      } catch (e) {}
    </script>
    <style>
      /* Privacidade ao sair do app (anotações 46 e 59): camada OPACA e sólida, já no HTML desde o início (só alterna uma
         classe), para aparecer na hora em que o sistema tira a miniatura de "apps recentes". O desfoque é só transição. */
      #sf-privacidade{position:fixed;inset:0;z-index:2147483646;display:none;align-items:center;justify-content:center;background:#141413}
      html[data-theme=light] #sf-privacidade{background:#f6f5f1}
      html.sf-oculto #sf-privacidade{display:flex}
      #sf-privacidade span{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7a3cf0,#4a12b0 35%,#1f4a90 65%,#0f6275);font:500 38px/1 Optima,Candara,Georgia,serif;color:#fff}
    </style>
    <script>
      // Liga a camada o mais cedo possível: blur da janela (abre os recentes ou a barra de notificações), aba escondida,
      // pagehide e freeze. Some ao voltar (focus/visível/pageshow/resume). Funciona também antes do app carregar.
      (function () {
        var h = document.documentElement;
        function cobrir() { h.classList.add('sf-oculto'); }
        function descobrir() { if (document.visibilityState !== 'hidden') h.classList.remove('sf-oculto'); }
        window.__sfPrivacidade = { cobrir: cobrir, descobrir: descobrir };
        window.addEventListener('blur', cobrir);
        window.addEventListener('focus', descobrir);
        window.addEventListener('pagehide', cobrir);
        window.addEventListener('pageshow', descobrir);
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') cobrir(); else descobrir(); });
        document.addEventListener('freeze', cobrir);
        document.addEventListener('resume', descobrir);
      })();
    </script>
  <style>#faixa-previa{position:relative;z-index:10000;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px;background:#25223c;color:#fff;font:14px system-ui}#faixa-previa button{padding:8px 12px;border:1px solid #8882aa;border-radius:10px;background:#36314f;color:#fff;cursor:pointer}#faixa-previa button:disabled{opacity:.6}</style>
  </head>
  <body>
    <div id="faixa-previa"><b>Prévia 79–97 · use apenas dados fictícios</b><button id="exemplo-previa">Carregar demonstração (senha: demonstracao)</button><button id="reiniciar-previa">Reiniciar prévia</button></div>
    <div id="sf-privacidade" aria-hidden="true"><span>D</span></div>
    <div id="app"><div id="splash" style="position:fixed;inset:0;display:grid;place-items:center;background:#141413"><div style="width:min(38vw,180px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7a3cf0,#4a12b0 35%,#1f4a90 65%,#0f6275);box-shadow:0 20px 40px -16px rgba(94,24,216,.55),inset 0 -10px 22px rgba(255,255,255,.1);animation:sfsp 1.6s ease-in-out infinite alternate"><span style="font:500 min(20vw,92px)/1 Optima,Candara,Georgia,serif;color:#fff">D</span></div></div><style>@keyframes sfsp{from{transform:scale(.96);opacity:.85}to{transform:scale(1);opacity:1}}</style></div>
    <script src="./config.js"></script>
    <script type="module" src="./entry.js"></script>
  </body>
</html>
